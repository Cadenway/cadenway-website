<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Icônes de statut — Cadenway</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<sc-if value="{{embedded}}" hint-placeholder-val="{{ true }}">
  <sc-if value="{{notMs}}" hint-placeholder-val="{{ true }}">
  <svg viewBox="0 0 16 16" data-status="{{shown}}" class="cw-status block shrink-0 {{sizeCls}} {{tone}}" aria-hidden="true">
    <circle class="cw-status-ring" cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></circle>
    <circle class="cw-status-pie" cx="8" cy="8" r="1.75" fill="none" stroke="currentColor" stroke-width="3.5" transform="rotate(-90 8 8)"></circle><path class="cw-status-wait" d="M8 4.6V8l2.3 1.5" pathLength="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path class="cw-status-in" d="M8 3.9v5.6M5.6 7.3 8 9.7l2.4-2.4" pathLength="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle class="cw-status-disc" cx="8" cy="8" r="6.5" fill="currentColor"></circle>
    <path class="cw-status-check" d="M5.5 8.5 7 10l3.5-3.5" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    <path class="cw-status-x" d="M5.75 5.75 10.25 10.25" fill="none" stroke-width="1.5" stroke-linecap="round"></path>
    <path class="cw-status-x" d="M10.25 5.75 5.75 10.25" fill="none" stroke-width="1.5" stroke-linecap="round"></path>
    <path class="cw-status-bar" d="M4.46 4.46 11.54 11.54" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
  </svg>
  </sc-if>
  <sc-if value="{{isMs}}" hint-placeholder-val="{{ false }}">
    <svg viewBox="0 0 16 16" data-status="{{shown}}" class="cw-status cw-ms block shrink-0 {{sizeCls}} {{tone}}" aria-hidden="true">
      <defs><clipPath id="cw-ms-clip"><rect x="5.15" y="5.15" width="5.7" height="5.7" rx="1" transform="rotate(45 8 8)"></rect></clipPath></defs>
      <g transform="rotate(45 8 8)"><rect class="cw-status-ring" x="2.9" y="2.9" width="10.2" height="10.2" rx="2.4" pathLength="39.27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></rect></g>
      <g clip-path="url(#cw-ms-clip)"><circle class="cw-status-pie" cx="8" cy="8" r="2.5" pathLength="11" fill="none" stroke="currentColor" stroke-width="5" transform="rotate(-90 8 8)"></circle></g>
      <g transform="rotate(45 8 8)"><rect class="cw-status-disc" x="2.65" y="2.65" width="10.7" height="10.7" rx="2.5" fill="currentColor"></rect></g>
      <g transform="translate(8 8) scale(0.816) translate(-8 -8)"><path class="cw-status-wait" d="M8 4.6V8l2.3 1.5" pathLength="1" fill="none" stroke="currentColor" stroke-width="1.84" stroke-linecap="round" stroke-linejoin="round"></path><path class="cw-status-in" d="M8 3.9v5.6M5.6 7.3 8 9.7l2.4-2.4" pathLength="1" fill="none" stroke="currentColor" stroke-width="1.84" stroke-linecap="round" stroke-linejoin="round"></path>
        <path class="cw-status-check" d="M5.5 8.5 7 10l3.5-3.5" fill="none" stroke-width="1.84" stroke-linecap="round" stroke-linejoin="round"></path>
        <path class="cw-status-x" d="M5.75 5.75 10.25 10.25" fill="none" stroke-width="1.84" stroke-linecap="round"></path>
        <path class="cw-status-x" d="M10.25 5.75 5.75 10.25" fill="none" stroke-width="1.84" stroke-linecap="round"></path>
        <path class="cw-status-bar" d="M4.46 4.46 11.54 11.54" fill="none" stroke="currentColor" stroke-width="1.84" stroke-linecap="round"></path></g>
    </svg>
  </sc-if>
</sc-if>

<sc-if value="{{standalone}}" hint-placeholder-val="{{ false }}">
  <div data-theme="{{theme}}" class="flex min-h-screen flex-col gap-5 bg-background p-6 font-sans text-sm text-foreground antialiased">
    <div class="flex flex-wrap items-center gap-4">
      <svg viewBox="0 0 16 16" data-status="{{demo.key}}" class="cw-status block size-12 shrink-0 {{demo.tone}}" role="img" aria-label="{{demo.label}}">
        <circle class="cw-status-ring" cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></circle>
        <circle class="cw-status-pie" cx="8" cy="8" r="1.75" fill="none" stroke="currentColor" stroke-width="3.5" transform="rotate(-90 8 8)"></circle><path class="cw-status-wait" d="M8 4.6V8l2.3 1.5" pathLength="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path class="cw-status-in" d="M8 3.9v5.6M5.6 7.3 8 9.7l2.4-2.4" pathLength="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
        <circle class="cw-status-disc" cx="8" cy="8" r="6.5" fill="currentColor"></circle>
        <path class="cw-status-check" d="M5.5 8.5 7 10l3.5-3.5" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
        <path class="cw-status-x" d="M5.75 5.75 10.25 10.25" fill="none" stroke-width="1.5" stroke-linecap="round"></path>
        <path class="cw-status-x" d="M10.25 5.75 5.75 10.25" fill="none" stroke-width="1.5" stroke-linecap="round"></path>
        <path class="cw-status-bar" d="M4.46 4.46 11.54 11.54" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
      </svg>
      <svg viewBox="0 0 16 16" data-status="{{demo.key}}" class="cw-status cw-ms block size-12 shrink-0 {{demo.tone}}" role="img" aria-label="Jalon (losange) : {{demo.label}}">
        <defs><clipPath id="cw-ms-clip-demo"><rect x="5.15" y="5.15" width="5.7" height="5.7" rx="1" transform="rotate(45 8 8)"></rect></clipPath></defs>
        <g transform="rotate(45 8 8)"><rect class="cw-status-ring" x="2.9" y="2.9" width="10.2" height="10.2" rx="2.4" pathLength="39.27" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></rect></g>
        <g clip-path="url(#cw-ms-clip-demo)"><circle class="cw-status-pie" cx="8" cy="8" r="2.5" pathLength="11" fill="none" stroke="currentColor" stroke-width="5" transform="rotate(-90 8 8)"></circle></g>
        <g transform="rotate(45 8 8)"><rect class="cw-status-disc" x="2.65" y="2.65" width="10.7" height="10.7" rx="2.5" fill="currentColor"></rect></g>
        <g transform="translate(8 8) scale(0.816) translate(-8 -8)"><path class="cw-status-wait" d="M8 4.6V8l2.3 1.5" pathLength="1" fill="none" stroke="currentColor" stroke-width="1.84" stroke-linecap="round" stroke-linejoin="round"></path><path class="cw-status-in" d="M8 3.9v5.6M5.6 7.3 8 9.7l2.4-2.4" pathLength="1" fill="none" stroke="currentColor" stroke-width="1.84" stroke-linecap="round" stroke-linejoin="round"></path>
          <path class="cw-status-check" d="M5.5 8.5 7 10l3.5-3.5" fill="none" stroke-width="1.84" stroke-linecap="round" stroke-linejoin="round"></path>
          <path class="cw-status-x" d="M5.75 5.75 10.25 10.25" fill="none" stroke-width="1.84" stroke-linecap="round"></path>
          <path class="cw-status-x" d="M10.25 5.75 5.75 10.25" fill="none" stroke-width="1.84" stroke-linecap="round"></path>
          <path class="cw-status-bar" d="M4.46 4.46 11.54 11.54" fill="none" stroke="currentColor" stroke-width="1.84" stroke-linecap="round"></path></g>
      </svg>
      <div class="flex min-w-0 flex-1 flex-col gap-1">
        <h1 class="text-base font-semibold">Icônes de statut animées</h1>
        <p class="text-xs text-muted-foreground">Un seul SVG de 16 px au trait Phosphor (1,5 px), qui se transforme d'un statut à l'autre. Toujours accompagné du mot ; la forme porte le sens, la couleur le confirme.</p>
      </div>
      <button type="button" onClick="{{next}}" class="relative isolate inline-flex h-8 items-center justify-center gap-1.5 overflow-hidden whitespace-nowrap rounded-lg bg-foreground px-2.5 text-sm font-medium text-background transition-all hover:bg-foreground/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background"><span class="ng-icon phosphorArrowsClockwiseBold" aria-hidden="true"></span>Statut suivant</button>
    </div>
    <div role="radiogroup" aria-label="Statut affiché" class="grid grid-cols-2 gap-2 sm:grid-cols-5">
      <sc-for list="{{tiles}}" as="tl" hint-placeholder-count="10">
        <button type="button" role="radio" aria-checked="{{tl.on}}" data-state="{{tl.state}}" onClick="{{tl.pick}}" class="flex flex-col items-start gap-1.5 rounded-lg border border-border p-3 text-left transition-colors hover:bg-muted data-[state=checked]:border-primary/50 data-[state=checked]:bg-primary/5 data-[state=checked]:hover:bg-primary/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background">
          <span class="flex items-center gap-2 text-sm font-medium">
            <svg viewBox="0 0 16 16" data-status="{{tl.key}}" class="cw-status block size-4 shrink-0 {{tl.tone}}" aria-hidden="true">
              <circle class="cw-status-ring" cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></circle>
              <circle class="cw-status-pie" cx="8" cy="8" r="1.75" fill="none" stroke="currentColor" stroke-width="3.5" transform="rotate(-90 8 8)"></circle><path class="cw-status-wait" d="M8 4.6V8l2.3 1.5" pathLength="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path class="cw-status-in" d="M8 3.9v5.6M5.6 7.3 8 9.7l2.4-2.4" pathLength="1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
              <circle class="cw-status-disc" cx="8" cy="8" r="6.5" fill="currentColor"></circle>
              <path class="cw-status-check" d="M5.5 8.5 7 10l3.5-3.5" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
              <path class="cw-status-x" d="M5.75 5.75 10.25 10.25" fill="none" stroke-width="1.5" stroke-linecap="round"></path>
              <path class="cw-status-x" d="M10.25 5.75 5.75 10.25" fill="none" stroke-width="1.5" stroke-linecap="round"></path>
              <path class="cw-status-bar" d="M4.46 4.46 11.54 11.54" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
            </svg>{{tl.label}}
          </span>
          <span class="text-xs text-muted-foreground">{{tl.hint}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"status":{"editor":null,"tsType":"\"triage\" | \"backlog\" | \"todo\" | \"progress\" | \"review\" | \"testing\" | \"waiting\" | \"blocked\" | \"done\" | \"cancelled\""},"from":{"editor":null,"tsType":"string | undefined"},"milestone":{"editor":null,"tsType":"boolean | undefined"},"dim":{"editor":null,"tsType":"\"3\" | \"3.5\" | \"4\" | \"5\""},"$preview":{"width":640,"height":300}}'>
const TONES = { triage: 'text-amethyste', testing: 'text-jade', backlog: 'text-ink-muted', todo: 'text-ink-muted', progress: 'text-balise', review: 'text-cornaline', waiting: 'text-ink-muted', blocked: 'text-grenat', done: 'text-jade', cancelled: 'text-ink-muted' };
const LABELS = { triage: 'À trier', testing: 'En validation', backlog: 'À planifier', todo: 'À faire', progress: 'En cours', review: 'En revue', waiting: 'En attente', blocked: 'Bloqué', done: 'Terminé', cancelled: 'Annulé' };
const HINTS = {
  triage: 'quatre arcs ouverts en haut, flèche entrante',
  backlog: 'anneau de 12 points, pas encore planifié',
  todo: 'anneau de 8 tirets longs',
  progress: 'anneau plein, secteur à moitié',
  review: 'anneau plein, secteur aux trois quarts',
  testing: 'anneau plein, disque intérieur complet',
  waiting: 'anneau plein, aiguilles d’horloge',
  blocked: 'anneau plein, barre diagonale',
  done: 'disque plein, coche en réserve',
  cancelled: 'disque gris, croix en réserve',
};
const SIZES = { '3': 'size-3', '3.5': 'size-3.5', '4': 'size-4', '5': 'size-5' };
const ORDER = ['triage', 'backlog', 'todo', 'progress', 'review', 'testing', 'waiting', 'blocked', 'done', 'cancelled'];

class Component extends DCLogic {
  componentDidMount() {
    const p = this.props;
    if (p.status != null && p.from && p.from !== p.status) {
      this.raf = requestAnimationFrame(() => { this.raf = requestAnimationFrame(() => this.setState({ armed: true })); });
    }
    if (p.status == null) {
      try {
        const t = window.localStorage.getItem('cadenway-theme');
        if (t === 'dark' || t === 'light') this.setState({ stored: t });
      } catch (e) {}
      this.onStorage = (e) => {
        if (e.key === 'cadenway-theme' && (e.newValue === 'dark' || e.newValue === 'light')) this.setState({ stored: e.newValue });
      };
      window.addEventListener('storage', this.onStorage);
    }
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    if (this.onStorage) window.removeEventListener('storage', this.onStorage);
  }
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const embedded = p.status != null;
    const status = p.status || 'todo';
    const shown = p.from && p.from !== status && !s.armed ? p.from : status;
    const demoKey = s.demo || 'triage';
    // Jalon : la même icône animée, dessinée en losange (anneau, remplissage, coche, croix et barre suivent les mêmes transitions).
    const isMs = p.milestone === true || p.milestone === 'true';
    return {
      embedded,
      isMs: embedded && isMs, notMs: !isMs,
      standalone: !embedded,
      shown,
      tone: TONES[shown] || TONES.todo,
      sizeCls: SIZES[String(p.dim || '4')] || 'size-4',
      theme: s.stored || 'light',
      demo: { key: demoKey, tone: TONES[demoKey], label: LABELS[demoKey] },
      next: () => this.setState({ demo: ORDER[(ORDER.indexOf(demoKey) + 1) % ORDER.length] }),
      tiles: ORDER.map((k) => ({
        key: k, label: LABELS[k], hint: HINTS[k], tone: TONES[k],
        on: k === demoKey, state: k === demoKey ? 'checked' : 'unchecked',
        pick: () => this.setState({ demo: k }),
      })),
    };
  }
}
</script>
</body>
</html>
