<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Icônes de priorité — Waypoint</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<sc-if value="{{embedded}}" hint-placeholder-val="{{ true }}">
  <svg viewBox="0 0 16 16" data-priority="{{shown}}" class="wp-prio block shrink-0 {{sizeCls}} {{tone}}" aria-hidden="true">
    <rect class="wp-prio-bar" x="2.25" y="9" width="2.75" height="4.5" rx="1" fill="currentColor"></rect>
    <rect class="wp-prio-bar" x="6.625" y="6.25" width="2.75" height="7.25" rx="1" fill="currentColor"></rect>
    <rect class="wp-prio-bar" x="11" y="3" width="2.75" height="10.5" rx="1" fill="currentColor"></rect>
    <rect class="wp-prio-disc" x="1.5" y="1.5" width="13" height="13" rx="3.5" fill="currentColor"></rect>
    <path class="wp-prio-bang" d="M8 4.6v4.1" fill="none" stroke-width="1.75" stroke-linecap="round"></path>
    <circle class="wp-prio-dot" cx="8" cy="11.35" r="1.05"></circle>
  </svg>
</sc-if>

<sc-if value="{{standalone}}" hint-placeholder-val="{{ false }}">
  <div data-theme="{{theme}}" class="flex min-h-screen flex-col gap-5 bg-background p-6 font-sans text-sm text-foreground antialiased">
    <div class="flex flex-wrap items-center gap-4">
      <svg viewBox="0 0 16 16" data-priority="{{demo.key}}" class="wp-prio block size-12 shrink-0 {{demo.tone}}" role="img" aria-label="{{demo.label}}">
        <rect class="wp-prio-bar" x="2.25" y="9" width="2.75" height="4.5" rx="1" fill="currentColor"></rect>
        <rect class="wp-prio-bar" x="6.625" y="6.25" width="2.75" height="7.25" rx="1" fill="currentColor"></rect>
        <rect class="wp-prio-bar" x="11" y="3" width="2.75" height="10.5" rx="1" fill="currentColor"></rect>
        <rect class="wp-prio-disc" x="1.5" y="1.5" width="13" height="13" rx="3.5" fill="currentColor"></rect>
        <path class="wp-prio-bang" d="M8 4.6v4.1" fill="none" stroke-width="1.75" stroke-linecap="round"></path>
        <circle class="wp-prio-dot" cx="8" cy="11.35" r="1.05"></circle>
      </svg>
      <div class="flex min-w-0 flex-1 flex-col gap-1">
        <h1 class="text-base font-semibold">Icônes de priorité animées</h1>
        <p class="text-xs text-muted-foreground">Trois barres croissantes qui s’allument une à une ; « Urgente » se replie en pastille avec un point d’exclamation. Toujours accompagnées du mot : la forme porte le sens, la couleur le confirme.</p>
      </div>
      <button type="button" onClick="{{next}}" class="relative isolate inline-flex h-8 items-center justify-center gap-1.5 overflow-hidden whitespace-nowrap rounded-lg bg-foreground px-2.5 text-sm font-medium text-background transition-all hover:bg-foreground/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background"><span class="ng-icon phosphorArrowsClockwiseBold" aria-hidden="true"></span>Priorité suivante</button>
    </div>
    <div role="radiogroup" aria-label="Priorité affichée" class="grid grid-cols-2 gap-2 sm:grid-cols-4">
      <sc-for list="{{tiles}}" as="tl" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{tl.on}}" data-state="{{tl.state}}" onClick="{{tl.pick}}" class="flex flex-col items-start gap-1.5 rounded-lg border border-border p-3 text-left transition-colors hover:bg-muted data-[state=checked]:border-primary/50 data-[state=checked]:bg-primary/5 data-[state=checked]:hover:bg-primary/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background">
          <span class="flex items-center gap-2 text-sm font-medium {{tl.wordTone}}">
            <svg viewBox="0 0 16 16" data-priority="{{tl.key}}" class="wp-prio block size-4 shrink-0 {{tl.tone}}" aria-hidden="true">
              <rect class="wp-prio-bar" x="2.25" y="9" width="2.75" height="4.5" rx="1" fill="currentColor"></rect>
              <rect class="wp-prio-bar" x="6.625" y="6.25" width="2.75" height="7.25" rx="1" fill="currentColor"></rect>
              <rect class="wp-prio-bar" x="11" y="3" width="2.75" height="10.5" rx="1" fill="currentColor"></rect>
              <rect class="wp-prio-disc" x="1.5" y="1.5" width="13" height="13" rx="3.5" fill="currentColor"></rect>
              <path class="wp-prio-bang" d="M8 4.6v4.1" fill="none" stroke-width="1.75" stroke-linecap="round"></path>
              <circle class="wp-prio-dot" cx="8" cy="11.35" r="1.05"></circle>
            </svg>{{tl.label}}
          </span>
          <span class="text-xs text-muted-foreground">{{tl.hint}}</span>
        </button>
      </sc-for>
    </div>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"priority":{"editor":null,"tsType":"\"urgente\" | \"haute\" | \"moyenne\" | \"basse\""},"from":{"editor":null,"tsType":"string | undefined"},"dim":{"editor":null,"tsType":"\"3\" | \"3.5\" | \"4\" | \"5\""},"$preview":{"width":640,"height":260}}'>
const TONES = { urgente: 'text-grenat', haute: 'text-cornaline', moyenne: 'text-balise', basse: 'text-ink-muted' };
const LABELS = { urgente: 'Urgente', haute: 'Haute', moyenne: 'Moyenne', basse: 'Basse' };
const HINTS = {
  urgente: 'pastille rouge, point d’exclamation',
  haute: 'trois barres, orange',
  moyenne: 'deux barres, jaune',
  basse: 'une barre, gris',
};
const SIZES = { '3': 'size-3', '3.5': 'size-3.5', '4': 'size-4', '5': 'size-5' };
const ORDER = ['basse', 'moyenne', 'haute', 'urgente'];

class Component extends DCLogic {
  componentDidMount() {
    const p = this.props;
    if (p.priority != null && p.from && p.from !== p.priority) {
      this.raf = requestAnimationFrame(() => { this.raf = requestAnimationFrame(() => this.setState({ armed: true })); });
    }
    if (p.priority == null) {
      try {
        const t = window.localStorage.getItem('waypoint-theme');
        if (t === 'dark' || t === 'light') this.setState({ stored: t });
      } catch (e) {}
      this.onStorage = (e) => {
        if (e.key === 'waypoint-theme' && (e.newValue === 'dark' || e.newValue === 'light')) this.setState({ stored: e.newValue });
      };
      window.addEventListener('storage', this.onStorage);
    }
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    if (this.onStorage) window.removeEventListener('storage', this.onStorage);
  }
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const embedded = p.priority != null;
    const priority = TONES[p.priority] ? p.priority : 'moyenne';
    const shown = p.from && p.from !== priority && TONES[p.from] && !s.armed ? p.from : priority;
    const demoKey = s.demo || 'basse';
    return {
      embedded,
      standalone: !embedded,
      shown,
      tone: TONES[shown],
      sizeCls: SIZES[String(p.dim || '4')] || 'size-4',
      theme: s.stored || 'light',
      demo: { key: demoKey, tone: TONES[demoKey], label: LABELS[demoKey] },
      next: () => this.setState({ demo: ORDER[(ORDER.indexOf(demoKey) + 1) % ORDER.length] }),
      tiles: ORDER.map((k) => ({
        key: k, label: LABELS[k], hint: HINTS[k], tone: TONES[k], wordTone: k === 'urgente' ? 'text-destructive' : '',
        on: k === demoKey, state: k === demoKey ? 'checked' : 'unchecked',
        pick: () => this.setState({ demo: k }),
      })),
    };
  }
}
</script>
</body>
</html>
