name: Feature request
description: Propose a new feature or an improvement to cadenway-website.
labels: [enhancement]
body:
  - type: input
    id: task
    attributes:
      label: Cadenway task
      description: The task id, if one already tracks this idea.
      placeholder: CAD-482

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen. Link the mockup screen when there is one.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the problem, and why they fall short.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples from other tools, screenshots, constraints, other repositories involved.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
