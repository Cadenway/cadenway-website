name: Release

# release-please keeps a release pull request open from the Conventional Commits on main. Merging it
# tags vX.Y.Z and creates the GitHub release; this workflow then builds and publishes the image to
# GHCR and hands the version to the deploy workflow (staging, then production after approval).
on:
  push:
    branches: [main]

# Each job states the permissions it needs.
permissions: {}

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The deploy app key is an environment secret that only main may use.
    environment: release
    # Only this job is serialized: a production deploy waiting for its approval holds nothing here.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # The release pull request is opened by the Cadenway deploy app, not GITHUB_TOKEN, so the CI
      # of that pull request runs and the merge of a release triggers the next workflows.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.CADENWAY_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.CADENWAY_DEPLOY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    name: Image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release-please.outputs.version }}
          persist-credentials: false
      - name: Name the image
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        # GHCR names are lowercase.
        run: echo "name=ghcr.io/${OWNER,,}/${REPOSITORY}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          # The tag is the bare version, as versions.env in cadenway-ops holds it (1.4.0).
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.release-please.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: [release-please, image]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
