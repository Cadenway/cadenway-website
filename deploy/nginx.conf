server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Probed by the container healthcheck.
  location = /health/ready {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Build files carry a content hash in their name and never change.
  location ~* \.(?:js|css)$ {
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
  }

  # Every page is a prerendered file: an unknown path is a 404, never the home page.
  location / {
    add_header Cache-Control 'no-cache';
    try_files $uri $uri/index.html =404;
  }
}
