# Definition of website for Docker Compose; keep it self-contained.
# On each release the deploy workflow checks it and copies it into cadenway-ops, as
# environments/<env>/services/website.yaml for the environment it deploys to.
#
# Prerendered static files served on www.<domain> through Traefik.
services:
  website:
    image: ghcr.io/${GHCR_OWNER}/cadenway-website:${WEBSITE_VERSION}
    restart: unless-stopped
    networks:
      - edge
    # The environment in the router, service and network names keeps two stacks apart on one shared
    # Traefik.
    labels:
      - traefik.enable=true
      - traefik.docker.network=cadenway-edge-${ENVIRONMENT:-local}
      - traefik.http.routers.website-${ENVIRONMENT:-local}.rule=Host(`www.${DOMAIN}`)
      - traefik.http.services.website-${ENVIRONMENT:-local}.loadbalancer.server.port=8080
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health/ready']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M

# Declared identically by cadenway-ops and by every definition it includes.
networks:
  # One edge network per environment, created on the host by the edge Traefik (cadenway-ops
  # compose/edge.yaml): staging and production containers never share a network.
  edge:
    name: cadenway-edge-${ENVIRONMENT:-local}
    external: true
